services:
  postgres:
    build:
      context: . 
      dockerfile: ./backend/docker/local/postgres/Dockerfile

    env_file:
      - ./.envs/.env.local

    ports:
      - 6432:5432
    volumes:
      - nextgen_local_db:/var/lib/postgresql/data

    networks:
      - nextgen_local_nw

networks:
  nextgen_local_nw:
    external: true

volumes:
  nextgen_local_db: